<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリーブ検定mini</title>

  <style>
    :root {
      --primary: #10B981; 
      --primary-dark: #047857;
      --primary-light: #ECFDF5;
      --accent: #F59E0B;
      --text: #1F2937;
      --text-muted: #6B7280;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --correct: #059669;
      --correct-bg: #D1FAE5;
      --wrong: #E11D48;
      --wrong-bg: #FFE4E6;
      --border: #E2E8F0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.15);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 演出用スクリーン */
    #splashScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    #splashScreen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-wrap {
      width: 310px;
      height: 290px;
      margin-bottom: 0px;
      filter: drop-shadow(0 14px 28px rgba(4, 120, 87, 0.25));
    }

    /* モード選択時：ロゴ全体がポンッと出るポップアニメーション */
    .pop-simple {
      animation: popSimple 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
    }
    @keyframes popSimple {
      0% { transform: scale(0.6); opacity: 0; }
      75% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-title-group {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .splash-sub {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--text-muted);
      margin-top: -10px;
      letter-spacing: 3px;
      opacity: 0;
      transform: translateY(10px);
    }
    .splash-sub.play {
      animation: textSlideUp 0.5s ease 1.6s forwards;
    }
    .splash-sub.pop-simple-sub {
      animation: textSlideUp 0.3s ease 0.2s forwards !important;
    }
    .splash-skip-tip {
      position: absolute;
      bottom: 24px;
      font-size: 0.75rem;
      color: #A0AEC0;
      letter-spacing: 0.5px;
    }

    /* --- 初回起動時：組み立てアニメーション --- */
    .play-build .gear-layer-1 {
      transform-box: fill-box;
      transform-origin: center center;
      animation: spinGear1 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }
    .play-build .gear-layer-2 {
      transform-box: fill-box;
      transform-origin: center center;
      animation: spinGear2 0.75s cubic-bezier(0.34, 1.4, 0.64, 1) 0.1s both;
    }
    .play-build .gear-layer-3 {
      transform-box: fill-box;
      transform-origin: center center;
      animation: spinGear3 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) 0.2s both;
    }

    @keyframes spinGear1 {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes spinGear2 {
      0% { transform: scale(0) rotate(180deg); opacity: 0; }
      100% { transform: scale(1) rotate(30deg); opacity: 1; }
    }
    @keyframes spinGear3 {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(60deg); opacity: 1; }
    }

    .play-build .ribbon-anim {
      transform-box: fill-box;
      transform-origin: top center;
      animation: growRibbon 0.45s cubic-bezier(0.34, 1.3, 0.64, 1) 0.65s both;
    }
    @keyframes growRibbon {
      0% { transform: scaleY(0); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .play-build .crest-anim {
      transform-box: fill-box;
      transform-origin: center center;
      animation: popOlive 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s both;
    }
    @keyframes popOlive {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .play-build .title-banner-anim {
      transform-box: fill-box;
      transform-origin: center center;
      animation: slideInText 0.45s cubic-bezier(0.22, 1, 0.36, 1) 1.25s both;
    }
    @keyframes slideInText {
      0% { transform: scaleX(0.5) translateY(12px); opacity: 0; }
      100% { transform: scaleX(1) translateY(0); opacity: 1; }
    }

    @keyframes textSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* アプリ内ヘッダー */
    header {
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-svg-icon {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .header-title {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 900;
      font-size: 1.2rem;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      position: relative;
      text-shadow: 0 1px 3px rgba(4, 120, 87, 0.6), 0 0 1px rgba(0,0,0,0.3);
    }
    .header-title span {
      position: relative;
      z-index: 2;
    }
    .header-title::after {
      content: "";
      position: absolute;
      top: 52%;
      left: -6%;
      width: 112%;
      height: 2px;
      background: linear-gradient(90deg, #FDE047, #F59E0B, #FEF08A);
      transform: translateY(-50%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 1;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 1.05rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .screen { padding: 24px; display: none; }
    .screen.active { display: block; }

    .start-content { text-align: center; padding: 12px 4px 8px; }
    .start-title { font-size: 1.55rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 20px; letter-spacing: -0.5px; }
    .section-label { font-weight: bold; font-size: 0.85rem; color: var(--text-muted); display: block; text-align: left; margin-bottom: 8px; }

    .mode-selection { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .mode-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 13px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .mode-icon { font-size: 1.5rem; flex-shrink: 0; }
    .mode-info-title { font-weight: bold; font-size: 0.95rem; color: var(--text); }
    .mode-info-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    .count-selection { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .count-btn { background: white; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: var(--text); transition: all 0.2s; }
    .count-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }

    .primary-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: background 0.2s, transform 0.1s; }
    .primary-btn:hover { background: var(--primary-dark); }
    .primary-btn:active { transform: scale(0.98); }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .badge-category { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); font-weight: bold; font-size: 0.8rem; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 1.15rem; font-weight: 700; line-height: 1.5; color: var(--text); margin-bottom: 18px; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-btn { background: white; border: 1.5px solid var(--border); padding: 13px 16px; border-radius: 10px; font-size: 0.95rem; color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; line-height: 1.4; }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-num { background: #F1F5F9; color: #475569; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct) !important; color: var(--correct); font-weight: bold; }
    .option-btn.correct .option-num { background: var(--correct); color: white; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong) !important; color: var(--wrong); }
    .option-btn.wrong .option-num { background: var(--wrong); color: white; }

    .feedback-box { display: none; background: var(--bg); border-radius: 10px; padding: 16px; border-left: 4px solid var(--primary); margin-bottom: 18px; animation: fadeIn 0.2s ease-in-out; }
    .feedback-status { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .feedback-status.is-correct { color: var(--correct); }
    .feedback-status.is-wrong { color: var(--wrong); }
    .feedback-text { font-size: 0.9rem; line-height: 1.5; color: #334155; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 結果画面アニメーションスタイル */
    
    /* お立地キャラクター用スタイル */
    .character-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      background: #000; /* 画像の背景が黒いため */
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 3px solid var(--primary);
    }
    /* アニメーション用クラス */
    .char-bounce {
      animation: charBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes charBounce {
      0% { transform: scale(0.3) translateY(20px); opacity: 0; }
      50% { transform: scale(1.1) translateY(-10px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .char-shake {
      animation: charShake 0.5s ease-in-out both;
    }
    @keyframes charShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .char-droop {
      animation: charDroop 1s ease-out both;
    }
    @keyframes charDroop {
      0% { transform: translateY(-20px) scale(1.05); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* モード選択画面のキャラクター */
    .start-character-wrap {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
    }
    .start-character-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #000;
      border: 3px solid var(--primary-light);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      animation: floatChar 3s ease-in-out infinite;
    }
    @keyframes floatChar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    /* スコア表示の調整 */
    .result-score-info {
      margin-top: -5px;
      margin-bottom: 16px;
    }
    .score-num { font-size: 2.2rem; font-weight: 900; color: var(--primary-dark); line-height: 1; }
    .score-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: block; font-weight: bold; }

    .result-content { 
      text-align: center;
      position: relative;
    }

    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    
    
    

    
    

    
    

    
    

    .result-msg { font-size: 1.25rem; font-weight: bold; margin-bottom: 6px; }
    .result-submsg { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; }
    .review-list { text-align: left; margin-bottom: 20px; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #FFFFFF; }
    .review-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .review-item:last-child { border-bottom: none; }
    .review-q { font-weight: bold; color: var(--text); margin-bottom: 2px; }
    .review-ans { color: var(--correct); }
  </style>
</head>
<body>

<div class="container">

  <!-- 演出用スクリーン -->
  <div id="splashScreen">
    <div class="splash-logo-wrap" id="logoWrap">
      
      <svg viewBox="0 0 200 210" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047"/>
            <stop offset="50%" stop-color="#D97706"/>
            <stop offset="100%" stop-color="#78350F"/>
          </linearGradient>
          <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A"/>
            <stop offset="50%" stop-color="#B45309"/>
            <stop offset="100%" stop-color="#451A03"/>
          </linearGradient>
          <linearGradient id="royalRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DC2626"/>
            <stop offset="50%" stop-color="#991B1B"/>
            <stop offset="100%" stop-color="#7F1D1D"/>
          </linearGradient>
        </defs>

        <!-- 2. リボン -->
        <g class="ribbon-anim">
          <path d="M70,95 L55,165 L75,150 L90,170 L95,95 Z" fill="url(#royalRed)" stroke="#78350F" stroke-width="1.5"/>
          <path d="M130,95 L145,165 L125,150 L110,170 L105,95 Z" fill="url(#royalRed)" stroke="#78350F" stroke-width="1.5"/>
        </g>

        <!-- 1. 3層のゴールドプレート -->
        <g>
          <rect class="gear-layer-1" x="52" y="17" width="96" height="96" fill="url(#gold1)" rx="4"/>
          <rect class="gear-layer-2" x="52" y="17" width="96" height="96" fill="url(#gold2)" rx="4"/>
          <rect class="gear-layer-3" x="52" y="17" width="96" height="96" fill="url(#gold1)" rx="4"/>
        </g>

        <!-- 3. 中央のエメラルド紋章＆オリーブ -->
        <g class="crest-anim">
          <circle cx="100" cy="65" r="40" fill="#FFFFFF" />
          <circle cx="100" cy="65" r="35" fill="#064E3B" stroke="url(#gold2)" stroke-width="3"/>
          <circle cx="100" cy="65" r="28" fill="none" stroke="url(#gold1)" stroke-width="1.5" stroke-dasharray="3 3"/>
          
          <g transform="translate(100, 65) scale(0.38) translate(-70, -62)">
            <path d="M45,90 Q75,60 95,35" stroke="url(#gold1)" stroke-width="6" stroke-linecap="round"/>
            <path d="M60,75 Q45,60 50,45 Q65,50 60,75 Z" fill="#34D399" />
            <path d="M85,55 Q100,70 95,85 Q80,80 85,55 Z" fill="#34D399" />
            <path d="M75,45 Q60,30 65,15 Q80,20 75,45 Z" fill="#34D399" />
            <circle cx="70" cy="68" r="14" fill="url(#gold2)" />
          </g>
        </g>

        <!-- 4. 文字と白帯 -->
        <g class="title-banner-anim">
          <path d="M 2,170 L 20,100 L 198,100 L 180,170 Z" fill="rgba(255, 255, 255, 0.95)" stroke="url(#gold1)" stroke-width="2"/>

          <!-- 横線・トゲ（ミントグリーン #10B981） -->
          <g>
            <line x1="10" y1="129" x2="185" y2="129" stroke="#10B981" stroke-width="2" />
            <line x1="80" y1="121" x2="175" y2="121" stroke="#059669" stroke-width="1.2" />
            <line x1="15" y1="137" x2="80" y2="137" stroke="#10B981" stroke-width="0.8" />
            
            <polygon points="120,129 128,111 124,129" fill="#10B981" />
            <polygon points="150,121 158,105 154,121" fill="#059669" />
            <polygon points="65,129 70,117 68,129" fill="#10B981" />

            <line x1="156" y1="157" x2="190" y2="157" stroke="#10B981" stroke-width="1.2" />
            <line x1="165" y1="165" x2="182" y2="149" stroke="#10B981" stroke-width="0.8" />
          </g>

          <!-- 文字（黒色 #111111） -->
          <g font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif" font-weight="900" fill="#111111">
            <text x="25" y="147" font-size="22" transform="rotate(-5 25 147)">オ</text>
            <text x="48" y="143" font-size="21" transform="rotate(4 48 143)">リ</text>
            <text x="70" y="149" font-size="23" transform="rotate(-6 70 149)">ー</text>
            <text x="94" y="145" font-size="24" transform="rotate(3 94 145)">ブ</text>

            <text id="animTextPart1" x="124" y="150" font-size="26" transform="rotate(-4 124 150)">検</text>
            <text id="animTextPart2" x="154" y="146" font-size="27" transform="rotate(5 154 146)">定</text>

            <text x="162" y="163" font-size="11" font-style="italic" letter-spacing="1">MINI</text>
          </g>
        </g>

      </svg>
    </div>

    <div class="splash-title-group">
      <p class="splash-sub" id="animSubText">OLIVE KENTEI</p>
    </div>

    <div class="splash-skip-tip">タップしてスキップ</div>
  </div>

  <!-- 常設ヘッダー -->
  <header>
    <div class="header-logo-group">
      <svg class="header-svg-icon" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hGold1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047"/><stop offset="50%" stop-color="#D97706"/><stop offset="100%" stop-color="#78350F"/>
          </linearGradient>
          <linearGradient id="hGold2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A"/><stop offset="50%" stop-color="#B45309"/><stop offset="100%" stop-color="#451A03"/>
          </linearGradient>
          <linearGradient id="hRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DC2626"/><stop offset="50%" stop-color="#991B1B"/><stop offset="100%" stop-color="#7F1D1D"/>
          </linearGradient>
        </defs>
        <g transform="translate(80, 80)">
          <path d="M-30,30 L-45,100 L-25,90 L-10,105 L-5,30 Z" fill="url(#hRed)" stroke="#78350F" stroke-width="1.5"/>
          <path d="M30,30 L45,100 L25,90 L10,105 L5,30 Z" fill="url(#hRed)" stroke="#78350F" stroke-width="1.5"/>
          <rect x="-48" y="-48" width="96" height="96" fill="url(#hGold1)" rx="4"/>
          <rect x="-48" y="-48" width="96" height="96" fill="url(#hGold2)" transform="rotate(30)" rx="4"/>
          <rect x="-48" y="-48" width="96" height="96" fill="url(#hGold1)" transform="rotate(60)" rx="4"/>
          <circle r="40" fill="#FFFFFF" />
          <circle r="35" fill="#064E3B" stroke="url(#hGold2)" stroke-width="3"/>
          <circle r="28" fill="none" stroke="url(#hGold1)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <g transform="scale(0.38) translate(-70, -60)">
            <path d="M45,90 Q75,60 95,35" stroke="url(#hGold1)" stroke-width="6" stroke-linecap="round"/>
            <path d="M60,75 Q45,60 50,45 Q65,50 60,75 Z" fill="#34D399" />
            <path d="M85,55 Q100,70 95,85 Q80,80 85,55 Z" fill="#34D399" />
            <path d="M75,45 Q60,30 65,15 Q80,20 75,45 Z" fill="#34D399" />
            <circle cx="70" cy="68" r="14" fill="url(#hGold2)" />
          </g>

  function triggerAnimation(modeKey, isBuild, onComplete) {
    const info = MODE_TITLES[modeKey] || MODE_TITLES.init;
    animTextPart1.textContent = info.p1;
    animTextPart2.textContent = info.p2;
    animSubText.textContent = info.sub;

    hPart2.textContent = info.p2;

    logoWrap.className = "splash-logo-wrap";
    animSubText.className = "splash-sub";
    void logoWrap.offsetWidth;

    if (isBuild) {
      logoWrap.classList.add("play-build");
      animSubText.classList.add("play");
    } else {
      logoWrap.classList.add("pop-simple");
      animSubText.classList.add("pop-simple-sub");
    }

    splashScreen.classList.remove("fade-out");

    const duration = isBuild ? 2600 : 1200;

    clearTimeout(splashTimer);
    splashTimer = setTimeout(() => {
      splashScreen.classList.add("fade-out");
      if (onComplete) onComplete();
    }, duration);

    splashScreen.onclick = () => {
      clearTimeout(splashTimer);
      splashScreen.classList.add("fade-out");
      if (onComplete) onComplete();

  class SoundFX {
    constructor() {
      this.enabled = true;
      this.ctx = null;
    }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    playTone(freq, type, duration, delay = 0) {
      if (!this.enabled) return;
      this.init();
      setTimeout(() => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }, delay * 1000);
    }
    correct() {
      this.playTone(523.25, "sine", 0.15, 0);
      this.playTone(659.25, "sine", 0.25, 0.12);
    }
    wrong() {
      this.playTone(240, "triangle", 0.2, 0);
      this.playTone(180, "triangle", 0.3, 0.15);
    }
    fanfare() {
      if (!this.enabled) return;
      this.playTone(523.25, "sine", 0.12, 0);       // C5
      this.playTone(659.25, "sine", 0.12, 0.12);    // E5
      this.playTone(783.99, "sine", 0.12, 0.24);    // G5
      this.playTone(1046.50, "triangle", 0.5, 0.36);// C6
    }
    sad() {
      if (!this.enabled) return;
      this.playTone(329.63, "sawtooth", 0.25, 0);   // E4
      this.playTone(311.13, "sawtooth", 0.25, 0.2); // D#4
      this.playTone(293.66, "sawtooth", 0.5, 0.4);  // D4
    }
  }

  let confettiAnimId = null;
  function launchConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const colors = ["#F59E0B", "#10B981", "#EF4444", "#3B82F6", "#8B5CF6", "#FDE047"];
    const particles = [];
    const count = 75;

    for (let i = 0; i < count; i++) {
      particles.push({
        x: canvas.width / 2 + (Math.random() * 40 - 20),
        y: canvas.height * 0.3,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 11 - 4,
        size: Math.random() * 7 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 12,
        opacity: 1,
        gravity: 0.38
      });
    }

    if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.rotation += p.rSpeed;
        if (p.y > canvas.height * 0.5) {
          p.opacity -= 0.015;
        }

        if (p.opacity > 0 && p.y < canvas.height) {
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      });

      if (alive) {
        confettiAnimId = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    confettiAnimId = requestAnimationFrame(frame);
  }

    progressFill.style.width = `${(currentIndex / currentQuestions.length) * 100}%`;

    questionText.textContent = q.q;
    optionsContainer.innerHTML = "";
    feedbackBox.style.display = "none";
    nextBtn.style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-num">${idx + 1}</span> <span>${opt}</span>`;
      btn.addEventListener("click", () => handleAnswer(idx));
      optionsContainer.appendChild(btn);
    });
  }

  function handleAnswer(selectedIndex) {
    const q = currentQuestions[currentIndex];
    const isCorrect = selectedIndex === q.answer;
    const buttons = optionsContainer.querySelectorAll(".option-btn");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) {
        btn.classList.add("correct");
      } else if (idx === selectedIndex) {
        btn.classList.add("wrong");
      }
    });

    if (isCorrect) {
      score++;
      sfx.correct();
      feedbackStatus.textContent = "⭕ 正解！";
      feedbackStatus.className = "feedback-status is-correct";
    } else {
      sfx.wrong();
      feedbackStatus.textContent = "❌ 不正解...";
      feedbackStatus.className = "feedback-status is-wrong";
    }

    userHistory.push({
      question: q.q,
      isCorrect: isCorrect,
      correctText: q.options[q.answer],
      exp: q.exp
    });

    feedbackText.textContent = q.exp;
    feedbackBox.style.display = "block";
    nextBtn.style.display = "block";
  }

  nextBtn.addEventListener("click", () => {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  });

  function showResults() {
    quizScreen.classList.remove("active");
    resultScreen.classList.add("active");

    const total = currentQuestions.length;
    const rate = Math.round((score / total) * 100);

    document.getElementById("finalScore").textContent = `${rate}%`;
    document.getElementById("finalScoreRatio").textContent = `${score} / ${total} 問 正解`;

    const titleEl = document.getElementById("resultTitle");
    const descEl = document.getElementById("resultDesc");
    const charWrap = document.getElementById("resultCharacterWrap");
    const charImg = document.getElementById("resultCharacterImg");

    // クラスと画像をリセット
    charWrap.className = "character-wrap";
    void charWrap.offsetWidth; // リフロー

    if (rate === 100) {
      // 1. 全問正解：笑顔おりっち
      charImg.src = "笑顔おりっち.jpg";
      charWrap.classList.add("char-bounce");
      titleEl.textContent = "🎊 パーフェクト達成！ 🎊";
      descEl.textContent = "全問正解です！オリーブマスターの称号を授与します！✨";
      launchConfetti();
      sfx.fanfare();
    } else if (rate >= 50) {
      // 2. 50%以上〜100%未満：真顔おりっち
      charImg.src = "真顔おりっち.jpg";
      charWrap.classList.add("char-bounce");
      if (rate >= 80) {
        titleEl.textContent = "合格ライン突破！";
        descEl.textContent = "この分野の知識はバッチリです！他の分野も制覇しましょう。";
      } else {
        titleEl.textContent = "あと一歩！";
        descEl.textContent = "間違えた問題の解説を確認して、もう一度挑戦してみましょう。";
      }
    } else if (rate > 0) {
      // 3. 1%以上〜50%未満：あやしおりっち
      charImg.src = "あやしおりっち.jpg";
      charWrap.classList.add("char-shake");
      titleEl.textContent = "復習して再挑戦！";
      descEl.textContent = "解説をじっくり読んでポイントを覚え直しましょう。";
    } else {
      // 4. 全問不正解：よぼぼおりっち
      charImg.src = "よぼぼおりっち.jpg";
      charWrap.classList.add("char-droop");
      titleEl.textContent = "💧 全問不正解… がっかり…";
      descEl.textContent = "ドンマイです！解説をじっくり読んで次は1問ずつリベンジしましょう！";
      sfx.sad();
    }

    const reviewBox = document.getElementById("reviewContainer");
    reviewBox.innerHTML = "<strong style='display:block;margin-bottom:6px;'>【今回の復習リスト】</strong>";
    userHistory.forEach((h, i) => {
      const item = document.createElement("div");
      item.className = "review-item";
      item.innerHTML = `
        <div class="review-q">${h.isCorrect ? '⭕' : '❌'} 問${i + 1}. ${h.question}</div>
        <div class="review-ans">正解: ${h.correctText}</div>
        <div style="color:#718096;margin-top:2px;">${h.exp}</div>
      `;
      reviewBox.appendChild(item);
    });
  }

  document.getElementById("retryBtn").addEventListener("click", () => {
    resultScreen.classList.remove("active");
    startScreen.classList.add("active");
  });
</script>
</body>
</html>
