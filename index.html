<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリーブ検定mini</title>
  
  <!-- Lucide Icons の読み込み -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- スタイリッシュなフォントの読み込み (Quicksandはスコア用, Montserratは既存用) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #10B981; 
      --primary-dark: #047857;
      --primary-light: #ECFDF5;
      --accent: #F59E0B;
      --text: #1F2937;
      --text-muted: #6B7280;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --correct: #059669;
      --correct-bg: #D1FAE5;
      --wrong: #E11D48;
      --wrong-bg: #FFE4E6;
      --border: #E2E8F0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(4, 120, 87, 0.2);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* === Lucide Icon 用のユーティリティクラス === */
    .lucide {
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-xs { width: 14px; height: 14px; stroke-width: 3; }
    .icon-sm { width: 18px; height: 18px; stroke-width: 2.5; }
    .icon-md { width: 22px; height: 22px; stroke-width: 2.5; }
    .icon-lg { width: 26px; height: 26px; stroke-width: 2; }
    .icon-xl { width: 32px; height: 32px; stroke-width: 2; }

    /* 演出用スクリーン (※一切変更していません) */
    #splashScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #FFFFFF;
      z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    #splashScreen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

    .splash-logo-wrap {
      width: 310px; height: 290px; margin-bottom: 0px;
      filter: drop-shadow(0 14px 28px rgba(4, 120, 87, 0.25)); position: relative;
    }
    .splash-svg-icon { width: 100%; height: 100%; }
    .splash-oricchi {
      position: absolute; top: 31%; left: 50%; width: 90px; height: 90px;
      transform: translate(-50%, -50%); z-index: 10;
      animation: popOliveHTML 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s both;
    }
    @keyframes popOliveHTML {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      70% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .pop-simple { animation: popSimple 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important; }
    @keyframes popSimple { 0% { transform: scale(0.6); opacity: 0; } 75% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    .splash-title-group { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .splash-sub { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 0.85rem; font-weight: 900; color: var(--text-muted); margin-top: -10px; letter-spacing: 3px; opacity: 0; transform: translateY(10px); }
    .splash-sub.play { animation: textSlideUp 0.5s ease 1.6s forwards; }
    .splash-sub.pop-simple-sub { animation: textSlideUp 0.3s ease 0.2s forwards !important; }
    .splash-skip-tip { position: absolute; bottom: 24px; font-size: 0.75rem; color: #A0AEC0; letter-spacing: 0.5px; }

    .play-build .gear-layer-1 { transform-box: fill-box; transform-origin: center center; animation: spinGear1 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) forwards; }
    .play-build .gear-layer-2 { transform-box: fill-box; transform-origin: center center; animation: spinGear2 0.75s cubic-bezier(0.34, 1.4, 0.64, 1) 0.1s both; }
    .play-build .gear-layer-3 { transform-box: fill-box; transform-origin: center center; animation: spinGear3 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) 0.2s both; }
    @keyframes spinGear1 { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    @keyframes spinGear2 { 0% { transform: scale(0) rotate(180deg); opacity: 0; } 100% { transform: scale(1) rotate(30deg); opacity: 1; } }
    @keyframes spinGear3 { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(60deg); opacity: 1; } }

    .play-build .ribbon-anim { transform-box: fill-box; transform-origin: top center; animation: growRibbon 0.45s cubic-bezier(0.34, 1.3, 0.64, 1) 0.65s both; }
    @keyframes growRibbon { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }

    .play-build .crest-anim { transform-box: fill-box; transform-origin: center center; animation: popOlive 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s both; }
    @keyframes popOlive { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    .play-build .title-banner-anim { transform-box: fill-box; transform-origin: center center; animation: slideInText 0.45s cubic-bezier(0.22, 1, 0.36, 1) 1.25s both; }
    @keyframes slideInText { 0% { transform: scaleX(0.5) translateY(12px); opacity: 0; } 100% { transform: scaleX(1) translateY(0); opacity: 1; } }
    @keyframes textSlideUp { to { opacity: 1; transform: translateY(0); } }

    /* アプリ内ヘッダー (※一切変更していません) */
    header { background: var(--primary); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo-group { display: flex; align-items: center; gap: 12px; }
    
    .header-svg-container { position: relative; width: 44px; height: 44px; }
    .header-svg-icon { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .header-oricchi { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); z-index: 10; }

    .header-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 900; font-size: 1.2rem; color: #FFFFFF; display: flex; align-items: center; position: relative; text-shadow: 0 1px 3px rgba(4, 120, 87, 0.6), 0 0 1px rgba(0,0,0,0.3); }
    .header-title span { position: relative; z-index: 2; }
    .header-title::after { content: ""; position: absolute; top: 52%; left: -6%; width: 112%; height: 2px; background: linear-gradient(90deg, #FDE047, #F59E0B, #FEF08A); transform: translateY(-50%); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); pointer-events: none; z-index: 1; }

    .sound-btn { background: rgba(255, 255, 255, 0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 10; }

    .screen { padding: 24px; display: none; }
    .screen.active { display: block; }

    .start-content { text-align: center; padding: 12px 4px 8px; }
    .start-title { font-size: 1.55rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 20px; letter-spacing: -0.5px; }
    .section-label { font-weight: bold; font-size: 0.85rem; color: var(--text-muted); display: block; text-align: left; margin-bottom: 8px; }

    .mode-selection { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .mode-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 13px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .mode-icon { color: var(--primary-dark); flex-shrink: 0; }
    .mode-info-title { font-weight: bold; font-size: 0.95rem; color: var(--text); }
    .mode-info-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    .count-selection { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .count-btn { background: white; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: var(--text); transition: all 0.2s; }
    .count-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }

    .primary-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: background 0.2s, transform 0.1s; }
    .primary-btn:hover { background: var(--primary-dark); }
    .primary-btn:active { transform: scale(0.98); }

    /* === クイズ画面 === */
    .quiz-header { display: flex; flex-direction: column; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .quiz-header-top { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px; }
    
    .badge-category { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); font-weight: bold; font-size: 0.8rem; }
    
    .retire-btn { background: var(--wrong); color: white; border: none; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
    .retire-btn:hover { background: #BE123C; }

    .quiz-score-tracker { display: flex; gap: 12px; background: #F1F5F9; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .tracker-correct { display: inline-flex; align-items: center; gap: 4px; color: var(--correct); }
    .tracker-wrong { display: inline-flex; align-items: center; gap: 4px; color: var(--wrong); }

    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    
    .question-title { font-size: 1.15rem; font-weight: 700; line-height: 1.5; color: var(--text); margin-bottom: 18px; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-btn { background: white; border: 1.5px solid var(--border); padding: 13px 16px; border-radius: 10px; font-size: 0.95rem; color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; line-height: 1.4; }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-num { background: #F1F5F9; color: #475569; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
    
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct) !important; color: var(--correct); font-weight: bold; }
    .option-btn.correct .option-num { background: var(--correct); color: white; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong) !important; color: var(--wrong); }
    .option-btn.wrong .option-num { background: var(--wrong); color: white; }

    /* === アニメーション系 === */
    .anim-correct-shine { animation: correctShine 0.9s ease-out; }
    @keyframes correctShine { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); background-color: var(--correct); color: white; transform: scale(1); } 30% { box-shadow: 0 0 20px 8px rgba(16, 185, 129, 0.5); background-color: var(--correct); color: white; transform: scale(1.03); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); background-color: var(--correct-bg); color: var(--correct); transform: scale(1); } }
    .anim-correct-shine .option-num { animation: numShine 0.9s ease-out; }
    @keyframes numShine { 0%, 30% { background: white; color: var(--correct); } 100% { background: var(--correct); color: white; } }
    .anim-wrong-shake { animation: wrongShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px) rotate(-1deg); } 40%, 80% { transform: translateX(6px) rotate(1deg); } }
    .anim-screen-droop { animation: screenDroop 0.5s ease-out; }
    @keyframes screenDroop { 0% { transform: translateY(0); filter: grayscale(0%); } 30% { transform: translateY(8px); filter: grayscale(40%); } 100% { transform: translateY(0); filter: grayscale(0%); } }

    .feedback-box { display: none; background: var(--bg); border-radius: 10px; padding: 16px; border-left: 4px solid var(--primary); margin-bottom: 18px; animation: fadeIn 0.2s ease-in-out; }
    .feedback-status { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .feedback-status.is-correct { color: var(--correct); }
    .feedback-status.is-wrong { color: var(--wrong); }
    .feedback-text { font-size: 0.9rem; line-height: 1.5; color: #334155; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* --- キャラクター画像とメダル装飾の設定 --- */
    .character-img { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 4; border-radius: 50%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
    
    /* スタート画面のキャラはそのまま */
    .start-character-wrap { width: 100px; height: 100px; margin: 10px auto 20px; position: relative; display: flex; justify-content: center; align-items: center; animation: floatChar 3s ease-in-out infinite; }
    
    /* === 結果画面のメダルコンテナ (サイズ拡大・リボン撤去に伴う調整) === */
    #resultCharacterWrap { 
      width: 280px; height: 280px; /* 超特大サイズまで収容 */
      margin: 10px auto 20px; 
      position: relative; display: flex; justify-content: center; align-items: center; 
    }
    /* メダルコア(r=45)にぴったり収まるサイズに調整 */
    #resultCharacterWrap .character-img {
      width: 76px; height: 76px;
    }
    
    .deco-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; pointer-events: none; }
    
    /* メダルランクに応じた表示制御 (allとstdの区別なく同じSVGを表示) */
    .character-wrap.show-perfect-std .deco-gold,
    .character-wrap.show-perfect-all .deco-gold { display: block; }

    .character-wrap.show-good-std .deco-silver,
    .character-wrap.show-good-all .deco-silver { display: block; }

    .character-wrap.show-fair-std .deco-bronze,
    .character-wrap.show-fair-all .deco-bronze { display: block; }

    .character-wrap.show-bad-std .deco-iron,
    .character-wrap.show-bad-all .deco-iron { display: block; }

    .char-bounce { animation: charBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes charBounce { 0% { transform: scale(0.3) translateY(20px); opacity: 0; } 50% { transform: scale(1.1) translateY(-10px); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    .char-shake { animation: charShake 0.5s ease-in-out both; }
    @keyframes charShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    .char-droop { animation: charDroop 1s ease-out both; }
    @keyframes charDroop { 0% { transform: translateY(-20px) scale(1.05); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes floatChar { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    
    /* === スコア・称号表示 === */
    .result-score-info { position: relative; z-index: 10; margin-top: -10px; margin-bottom: 16px; }
    
    /* === Quicksandフォント＆影なし単色デザイン === */
    .score-num { 
      font-size: 4.5rem; 
      font-weight: 700; 
      line-height: 1; 
      display: inline-block;
      font-family: 'Quicksand', 'Avenir Next', 'Helvetica Neue', sans-serif;
      letter-spacing: -2px;
    }
    
    .score-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: block; font-weight: bold; }
    .rank-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }

    /* メダルカラー定義 (同系色の単色フラット) */
    .text-gold { color: #F59E0B; }
    .text-silver { color: #64748B; }
    .text-bronze { color: #B45309; }
    .text-iron { color: #4B5563; }
    
    .medal-gold { --m-light: #FDE047; --m-base: #F59E0B; --m-dark: #D97706; --m-xdark: #92400E; }
    .medal-silver { --m-light: #F8FAFC; --m-base: #CBD5E1; --m-dark: #94A3B8; --m-xdark: #475569; }
    .medal-bronze { --m-light: #FDBA74; --m-base: #D97706; --m-dark: #9A3412; --m-xdark: #7C2D12; }
    .medal-iron { --m-light: #D1D5DB; --m-base: #9CA3AF; --m-dark: #6B7280; --m-xdark: #374151; }

    .result-content { text-align: center; position: relative; }
    #confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .result-msg { font-size: 1.25rem; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .result-submsg { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; padding: 0 10px;}
    .review-list { text-align: left; margin-bottom: 20px; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #FFFFFF; }
    .review-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .review-item:last-child { border-bottom: none; }
    .review-q { font-weight: bold; color: var(--text); margin-bottom: 4px; display: flex; align-items: flex-start; gap: 6px; }
    .review-ans { color: var(--correct); padding-left: 20px; }
    .review-exp { color: #718096; margin-top: 4px; padding-left: 20px; line-height: 1.4; }

    /* === カスタム確認モーダル === */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 24, 39, 0.5); 
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: #FFFFFF;
      width: 85%; max-width: 340px;
      border-radius: 16px; padding: 24px; text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
    
    .modal-icon {
      background: #FEF3C7; color: #D97706;
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: var(--text); margin-bottom: 8px; }
    .modal-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; white-space: pre-wrap; }
    .modal-actions { display: flex; gap: 12px; }
    
    .modal-btn-cancel, .modal-btn-confirm {
      flex: 1; padding: 12px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s, transform 0.1s;
    }
    .modal-btn-cancel { background: #F1F5F9; color: #475569; }
    .modal-btn-cancel:hover { background: #E2E8F0; }
    .modal-btn-cancel:active { transform: scale(0.98); }
    .modal-btn-confirm { background: var(--wrong); color: white; }
    .modal-btn-confirm:hover { background: #BE123C; }
    .modal-btn-confirm:active { transform: scale(0.98); }
  </style>
</head>
<body>

<!-- メダルの金属グラデーション定義 (※スプラッシュスクリーンやヘッダーロゴに必須なため、元のまま残しています) -->
<svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
  <defs>
    <!-- 金色金属 -->
    <linearGradient id="metal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7B0"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="metal-gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/><stop offset="50%" stop-color="#78350F"/><stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

<script>
  // シャッフル関数
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* 演出アニメーション関係 (※元のコードから一切変更していません) */
  const MODE_TITLES = {
    init:    { p1: "検", p2: "定", sub: "OLIVE KENTEI" },
    history: { p1: "歴", p2: "史", sub: "HISTORY EDITION" },
    ecology: { p1: "生", p2: "態", sub: "ECOLOGY EDITION" },
    process: { p1: "加", p2: "工", sub: "PROCESS EDITION" }
  };

  const splashScreen = document.getElementById("splashScreen");
  const logoWrap = document.getElementById("logoWrap");
  const animTextPart1 = document.getElementById("animTextPart1");
  const animTextPart2 = document.getElementById("animTextPart2");
  const animSubText = document.getElementById("animSubText");
  const hPart1 = document.getElementById("hPart1");
  const hPart2 = document.getElementById("hPart2");

  let splashTimer = null;

  function triggerAnimation(modeKey, isBuild, onComplete) {
    const info = MODE_TITLES[modeKey] || MODE_TITLES.init;
    animTextPart1.textContent = info.p1;
    animTextPart2.textContent = info.p2;
    animSubText.textContent = info.sub;

    hPart1.textContent = info.p1;
    hPart2.textContent = info.p2;

    logoWrap.className = "splash-logo-wrap";
    animSubText.className = "splash-sub";
    void logoWrap.offsetWidth;

    if (isBuild) {
      logoWrap.classList.add("play-build");
      animSubText.classList.add("play");
    } else {
      logoWrap.classList.add("pop-simple");
      animSubText.classList.add("pop-simple-sub");
    }

    splashScreen.classList.remove("fade-out");

    const duration = isBuild ? 2600 : 1200;

    clearTimeout(splashTimer);
    splashTimer = setTimeout(() => {
      splashScreen.classList.add("fade-out");
      if (onComplete) onComplete();
    }, duration);

    splashScreen.onclick = () => {
      clearTimeout(splashTimer);
      splashScreen.classList.add("fade-out");
      if (onComplete) onComplete();
    };
  }

  window.addEventListener("DOMContentLoaded", () => {
    triggerAnimation("init", true);
  });

  /* =========================================================================
     過去問データ（R1,R4,R5,R6,R7）重複排除・解説統合の全67問
  ========================================================================= */
  const QUESTION_BANK = {
    history: [
      { q: "オリーブ栽培の始まりは、約何年前と言われているか", options: ["2,000年前", "4,000年前", "6,000年前", "8,000年前"], answer: 2, exp: "約6,000年前に小アジア地方で始まったというのが現在の定説です。" },
      { q: "オリーブ栽培の起源と言われている地域はどこか", options: ["ギリシャの島しょ部", "東南アジア地方", "地中海沿岸", "小アジア地方"], answer: 3, exp: "約6,000年前に小アジア地方で始まったというのが定説です。" },

  class SoundFX {
    constructor() {
      this.enabled = true;
      this.ctx = null;
    }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    playTone(freq, type, duration, delay = 0) {
      if (!this.enabled) return;
      this.init();
      setTimeout(() => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }, delay * 1000);
    }
    correct() {
      this.playTone(523.25, "sine", 0.15, 0);
      this.playTone(659.25, "sine", 0.25, 0.12);
    }
    wrong() {
      this.playTone(240, "triangle", 0.2, 0);
      this.playTone(180, "triangle", 0.3, 0.15);
    }
    fanfare() {
      if (!this.enabled) return;
      this.playTone(523.25, "sine", 0.12, 0);       
      this.playTone(659.25, "sine", 0.12, 0.12);    
      this.playTone(783.99, "sine", 0.12, 0.24);    
      this.playTone(1046.50, "triangle", 0.5, 0.36);
    }
    clear() {
      if (!this.enabled) return;
      this.playTone(523.25, "sine", 0.15, 0);       
      this.playTone(659.25, "sine", 0.15, 0.15);    
      this.playTone(783.99, "sine", 0.4, 0.3);      
    }
    tryAgain() {
      if (!this.enabled) return;
      this.playTone(392.00, "triangle", 0.15, 0);   
      this.playTone(329.63, "triangle", 0.15, 0.15); 
      this.playTone(261.63, "triangle", 0.4, 0.3);   
    }
    sad() {
      if (!this.enabled) return;
      this.playTone(329.63, "sawtooth", 0.25, 0);   
      this.playTone(311.13, "sawtooth", 0.25, 0.2); 
      this.playTone(293.66, "sawtooth", 0.5, 0.4);  
    }
  }

  let confettiAnimId = null;
  function launchConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const colors = ["#F59E0B", "#10B981", "#EF4444", "#3B82F6", "#8B5CF6", "#FDE047"];
    const particles = [];
    const count = 75;

    for (let i = 0; i < count; i++) {
      particles.push({
        x: canvas.width / 2 + (Math.random() * 40 - 20),
        y: canvas.height * 0.3,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 11 - 4,
        size: Math.random() * 7 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 12,
        opacity: 1,
        gravity: 0.38
      });
    }

    if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.rotation += p.rSpeed;
        if (p.y > canvas.height * 0.5) {
          p.opacity -= 0.015;
        }

        if (p.opacity > 0 && p.y < canvas.height) {
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      });

      if (alive) {
        confettiAnimId = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    confettiAnimId = requestAnimationFrame(frame);
  }

  function loadQuestion() {
    clearTimeout(questionTimer);
    clearTimeout(autoNextTimer);

    const q = currentQuestions[currentIndex];
    quizProgressText.textContent = `第 ${currentIndex + 1} 問 / ${currentQuestions.length}問`;
    progressFill.style.width = `${(currentIndex / currentQuestions.length) * 100}%`;

    questionText.textContent = q.q;
    optionsContainer.innerHTML = "";
    feedbackBox.style.display = "none";
    nextBtn.style.display = "none";

    let shuffledOptions = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
    shuffledOptions = shuffle(shuffledOptions);
    const correctIndex = shuffledOptions.findIndex(o => o.originalIdx === q.answer);
    currentCorrectIndex = correctIndex;

    shuffledOptions.forEach((optObj, displayIdx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-num">${displayIdx + 1}</span> <span>${optObj.text}</span>`;
      btn.addEventListener("click", () => handleAnswer(displayIdx, correctIndex));
      optionsContainer.appendChild(btn);
    });

    questionTimer = setTimeout(handleTimeout, 45000);
  }

  function handleTimeout() {
    timeoutCount++;

      forceResetToStart();

      handleAnswer(-1, currentCorrectIndex, true);
    }

  function handleAnswer(selectedIndex, correctIndex, isTimeout = false) {
    clearTimeout(questionTimer);
    clearTimeout(autoNextTimer);
    
    if (!isTimeout) {
      timeoutCount = 0; 
    }

    const q = currentQuestions[currentIndex];
    const isCorrect = selectedIndex === correctIndex;
    const buttons = optionsContainer.querySelectorAll(".option-btn");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) {
        btn.classList.add("correct");
        if (isCorrect && !isTimeout) {
          btn.classList.add("anim-correct-shine");
        }
      } else if (idx === selectedIndex && !isTimeout) {
        btn.classList.add("wrong");
        btn.classList.add("anim-wrong-shake");
      }

      score++;

        charWrap.classList.add("show-fair-std", "char-shake");
        scoreEl.classList.add("text-bronze");
        rankEl.innerHTML = `<i data-lucide="medal" class="icon-md"></i> 称号：オリーブ入門者`;
        rankEl.style.color = "#9A3412";
        titleEl.innerHTML = isRetire ? `途中棄権・もう少し！` : `復習して再挑戦！`;
        descEl.innerHTML = isRetire ? `今回は途中棄権となりました。復習リストを活用して次回は最後まで挑戦してみましょう！` : `解説をじっくり読んでポイントを覚え直しましょう。次はもっとできるはず！`;
        sfx.tryAgain();
      } else {
        charImg.src = "bad.png";
        charWrap.classList.add("show-bad-std", "char-droop");
        scoreEl.classList.add("text-iron");
        rankEl.innerHTML = `<i data-lucide="sprout" class="icon-md"></i> 称号：オリーブ見習い`;
        rankEl.style.color = "#1F2937";
        titleEl.innerHTML = isRetire ? `途中棄権・もう少し！` : `基礎から出直そう！`;
        descEl.innerHTML = isRetire ? `今回は途中棄権となりました。復習リストを活用して次回は最後まで挑戦してみましょう！` : `今回は残念！テキストをもう一度読んで、基礎知識をつけてから再挑戦しましょう！`;
        if (!isRetire) { sfx.sad(); } else { sfx.tryAgain(); }
      }
    }

    const reviewBox = document.getElementById("reviewContainer");
    reviewBox.innerHTML = `<strong style='display:flex; align-items:center; gap:6px; margin-bottom:12px;'><i data-lucide="book-open-check" class="icon-md"></i> 【今回の復習リスト】</strong>`;
    
    userHistory.forEach((h, i) => {
      const item = document.createElement("div");
      item.className = "review-item";
      const icon = h.isCorrect ? 'circle' : 'x';
      const colorClass = h.isCorrect ? 'tracker-correct' : 'tracker-wrong';
      item.innerHTML = `
        <div class="review-q">
          <span class="${colorClass}" style="flex-shrink:0;"><i data-lucide="${icon}" class="icon-sm"></i></span>
          <span>問${i + 1}. ${h.question}</span>
        </div>
        <div class="review-ans">正解: ${h.correctText}</div>
        <div class="review-exp">${h.exp}</div>
      `;
      reviewBox.appendChild(item);
    });
    
    // 生成したアイコンを描画
    lucide.createIcons();
  }

  document.getElementById("retryBtn").addEventListener("click", () => {
    forceResetToStart();
  });
  
  // 初回読み込み時にアイコンを描画
  lucide.createIcons();
</script>
</body>
</html>
